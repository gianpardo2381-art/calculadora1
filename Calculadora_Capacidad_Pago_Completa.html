<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Capacidad de Pago</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Segoe UI;background:#f4f7fb;margin:0}header{background:#0A4FA4;color:#fff;padding:20px}.card{background:#fff;margin:15px;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;padding:10px}.btn{padding:10px 14px;border:none;border-radius:10px;margin:4px}.primary{background:#0A4FA4;color:#fff}.success{background:#16a34a;color:#fff}.secondary{background:#6b7280;color:#fff}.danger{background:#dc2626;color:#fff}#estado{font-size:32px;font-weight:bold}.gauge{height:20px;background:#ddd;border-radius:20px;overflow:hidden}.gauge div{height:100%;width:0;background:#16a34a}</style></head><body><header><h1>Calculadora de Capacidad de Pago</h1><div>Análisis de Riesgo Crediticio</div></header><div class="card"><div class="grid"><input id="nombre" placeholder="Nombre del Cliente"><input id="identificacion" placeholder="Identificación"><input id="oficial" placeholder="Oficial"><input id="sucursal" placeholder="Sucursal"><select id="producto"><option>Personal</option><option>Auto</option><option>Hipotecario</option><option>Comercial</option></select><input id="ingreso" type="number" placeholder="Ingreso Neto"><input id="adicionales" type="number" placeholder="Ingresos Adicionales"><input id="obligaciones" type="number" placeholder="Obligaciones"><input id="nuevo" type="number" placeholder="Nuevo Préstamo"><input id="otros" type="number" placeholder="Otros Descuentos"></div><textarea id="obs" placeholder="Observaciones"></textarea><br><button class="btn primary" onclick="calc()">Calcular</button><button class="btn secondary" onclick="location.reload()">Limpiar</button><button class="btn success" onclick="print()">Imprimir</button></div><div class="card"><div id="estado">PENDIENTE</div><div class="gauge"><div id="bar"></div></div><p id="res"></p><canvas id="d"></canvas></div><footer class="card">Esta herramienta constituye un apoyo para el análisis de capacidad de pago.</footer><script>let c;function usd(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v)} function calc(){let i=+ingreso.value,a=+adicionales.value,o=+obligaciones.value,n=+nuevo.value,ot=+otros.value;let t=i+a,lim=t*.3,tot=o+n,p=(tot/t)*100,disp=t-tot-ot;let est='APROBADO',col='#16a34a';if(p>40){est='RECHAZADO';col='#dc2626'}else if(p>30){est='REVISIÓN';col='#f59e0b'}estado.innerText=est;estado.style.color=col;bar.style.width=Math.min(p,100)+'%';bar.style.background=col;res.innerHTML='Ingreso Total: '+usd(t)+'<br>Límite: '+usd(lim)+'<br>Obligaciones: '+usd(tot)+'<br>Disponible: '+usd(disp)+'<br>Endeudamiento: '+p.toFixed(2)+'%';if(c)c.destroy();c=new Chart(document.getElementById('d'),{type:'doughnut',data:{labels:['Ingreso','Obligaciones','Disponible'],datasets:[{data:[t,tot,Math.max(disp,0)]}]}})}</script></body></html>
